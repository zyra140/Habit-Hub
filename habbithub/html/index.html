<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HabHab</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="https://cloudflare.com" />

    <link rel="stylesheet" href="../css/general.css" />
    <link rel="stylesheet" href="../css/styles.css" />
  </head>

  <body>
    <header class="header">
      <nav class="main-nav">
        <img
          class="logo"
          src="../icons/logo_horizontal.png"
          alt="HabHab logo"
        />
        <ul class="main-nav-list">
          <li>
            <a class="main-nav-link active" href="#"
              ><img
                class="nav-icon"
                src="../icons/house-regular-full.svg"
                alt=""
              />Przegląd</a
            >
          </li>
          <li>
            <a class="main-nav-link" href="#"
              ><img
                class="nav-icon"
                src="../icons/spiral-solid-full.svg"
                alt=""
              />Nawyki</a
            >
          </li>
          <li>
            <a class="main-nav-link" href="#"
              ><img
                class="nav-icon"
                src="../icons/chart-bar-regular-full.svg"
                alt=""
              />Statystyki</a
            >
          </li>
          <li>
            <a class="main-nav-link" href="#"
              ><img
                class="nav-icon"
                src="../icons/calendar-days-regular-full.svg"
                alt=""
              />Kalendarz</a
            >
          </li>
          <li>
            <a class="main-nav-link" href="#"
              ><img
                class="nav-icon"
                src="../icons/user-regular-full.svg"
                alt=""
              />Znajomi</a
            >
          </li>
          <li>
            <a class="main-nav-link" href="#"
              ><img
                class="nav-icon"
                src="../icons/gear-solid-full.svg"
                alt=""
              />Ustawienia</a
            >
          </li>
        </ul>
      </nav>
    </header>

    <!-- DAY SUMMARY -->
    <main>
      <section class="section-day-summary">
        <div class="container">
          <div class="day-summary-text-box">
            <h1 class="heading-primary">Dzień dobry, Hubert! 👋</h1>
            <p class="day-summary-date">Wtorek, 18 czerwca 2024</p>
          </div>
          <div class="day-summary-panel-box">
            <div class="panel-box">
              <div class="panel-box-desc">
                <div class="panel-text-box">
                  <h3 class="heading-tertiary">Dzisiejszy postęp</h3>
                  <p class="stats-text">3 / 5</p>
                </div>
                <div class="img-box img-box--graph">
                  <img src="../icons/Graph.svg" alt="ascend graph icon" />
                </div>
              </div>
              <div class="panel-text">
                <p>wykonanych nawyków</p>
              </div>
              <div class="panel-graph">
                <div class="daily-chart-wrapper">
                  <div id="dailyChart"></div>
                </div>
                <span>60%</span>
              </div>
            </div>
            <div class="panel-box">
              <div class="panel-box-desc">
                <div class="img-box img-box--fire">
                  <img src="../icons/Fire.svg" />
                </div>
                <div class="panel-text-box">
                  <h3 class="heading-tertiary">Aktualna seria</h3>
                  <p class="stats-text stats-text--fire">7 dni</p>
                </div>
              </div>
              <div class="panel-graph">
                <p>Najdłuższa seria:</p>
                <p>18 dni</p>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- DAY TO DO -->
      <section class="section-day-todo">
        <div class="container">
          <div class="to-do-text-box">
            <h2 class="heading-secondary">Dzisiaj do wykonania</h2>
            <p class="habit-count-text">5 nawyków</p>
          </div>
          <div class="container-daily-habits">
            <div class="desc-daily-habits">
              <div class="img-box img-box--habit">
                <img
                  class="habit-icon"
                  src="../icons/piggy-bank-save-svgrepo-com.svg"
                  alt=""
                />
              </div>
              <div class="text-daily-habits">
                <h3 class="heading-tertiary habit-title">Oszczędzanie</h3>
                <p class="p-daily-habits">Codziennie</p>
              </div>
            </div>
            <div class="container-daily-habbits-btn">
              <button class="btn btn--done">
                <img class="nav-icon" src="../icons/done-v-svgrepo-com.svg" alt="">
                Wykonano
              </button>
              <button class="btn btn--skip">
                <img class="nav-icon" src="../icons/close-svgrepo-com (3).svg" alt="">
                Pomiń
              </button>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <script src="../script.js"></script>
  </body>
</html>
