<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HabHab</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="https://cloudflare.com" />

    <link rel="stylesheet" href="../css/general.css" />
    <link rel="stylesheet" href="../css/styles.css" />
</head>

<body>
  <header class="header">
      <nav class="main-nav">
        <img
          class="logo"
          src="../icons/logo_horizontal.png"
          alt="HabHab logo"
        />
        <ul class="main-nav-list">
          <li>
            <a class="main-nav-link active" href="../html/index.html"
              ><img
                class="nav-icon"
                src="../icons/house-regular-full.svg"
                alt=""
              />Przegląd</a
            >
          </li>
          <li>
            <a class="main-nav-link" href="../html/nawyki.html"
              ><img
                class="nav-icon"
                src="../icons/spiral-solid-full.svg"
                alt=""
              />Nawyki</a
            >
          </li>
          <li>
            <a class="main-nav-link" href="#"
              ><img
                class="nav-icon"
                src="../icons/chart-bar-regular-full.svg"
                alt=""
              />Statystyki</a
            >
          </li>
          <li>
            <a class="main-nav-link" href="#"
              ><img
                class="nav-icon"
                src="../icons/calendar-days-regular-full.svg"
                alt=""
              />Kalendarz</a
            >
          </li>
          <li>
            <a class="main-nav-link" href="#"
              ><img
                class="nav-icon"
                src="../icons/user-regular-full.svg"
                alt=""
              />Znajomi</a
            >
          </li>
          <li>
            <a class="main-nav-link" href="#"
              ><img
                class="nav-icon"
                src="../icons/gear-solid-full.svg"
                alt=""
              />Ustawienia</a
            >
          </li>
        </ul>
      </nav>
    </header>

  <main>
    <!-- ADD HABBIT SECTION -->
     <section class="section-add-habit">
      <div class="container container-add-habit">
        <div class="add-habbit-text-box">
          <h1 class="heading-primary">Dodaj nawyki</h1>
          <p class="paragraph-description">Wybierz nawyki, które chcesz realizować w danym miesiącu i zaznaczaj postępy każdego dnia.</p>
        </div>
        <div class="wrapper-month-switcher">
          <button class="btn btn--month-switcher">
            <img src="../icons/caret-left-fill.svg" alt="">
          </button>
          <div class="wrapper-month-picker">
            <p class="date">Czerwiec 2024</p>
            <button class="btn btn--month-switcher">
              <img src="../icons/caret-down-fill.svg" alt="">
            </button>
          </div>
          <button class="btn btn--month-switcher">
            <img src="../icons/caret-right-fill.svg" alt="">
          </button>
        </div>
      </div>
     </section>

     <!-- INPUT SECTION -->
      <section class="section-input">
        <div class="container"></div>
      </section>
  </main>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <script src="../script.js"></script>
</body>
</html>
