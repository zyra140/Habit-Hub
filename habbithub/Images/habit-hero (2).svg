<svg style="max-height: 500px" xmlns="http://www.w3.org/2000/svg" viewBox="433 45 434 395" role="img" aria-labelledby="title desc" width="434" height="395">
  <title>Zacznij budować swoje nawyki</title>
  <desc id="desc">Minimalistyczna ilustracja do aplikacji nawyków: tekst, przycisk, checklista, tarcza i roślina.</desc>
  <defs>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6E43E8"/>
      <stop offset="1" stop-color="#5730D9"/>
    </linearGradient>
    <linearGradient id="softBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5F1FF"/>
      <stop offset="1" stop-color="#E9E2FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#4B35A8" flood-opacity=".12"/>
    </filter>
  </defs>

  <rect width="900" height="500" fill="#fff"/>

  
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="34" y="68" font-size="34" font-weight="800" fill="#15183B">Zacznij budować</text>
    <text x="34" y="106" font-size="34" font-weight="800" fill="#15183B">swoje nawyki</text>

    <text x="34" y="151" font-size="15" font-weight="500" fill="#55566B">Nie masz jeszcze dodanych żadnych</text>
    <text x="34" y="174" font-size="15" font-weight="500" fill="#55566B">nawyków.</text>

    <text x="34" y="222" font-size="15" font-weight="500" fill="#55566B">Wybierz coś, co chcesz robić regularnie,</text>
    <text x="34" y="245" font-size="15" font-weight="500" fill="#55566B">i zacznij od małego kroku.</text>

    
    <path d="M246 34 l4 10 10 4-10 4-4 10-4-10-10-4 10-4z" fill="#FFDDB9"/>

    
    <g filter="url(#shadow)">
      <rect x="34" y="286" width="320" height="58" rx="9" fill="url(#purple)"/>
    </g>
    <path d="M56 315h16M64 307v16" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
    <text x="86" y="322" font-size="15" font-weight="700" fill="#fff">Dodaj swój pierwszy nawyk</text>
  </g>

  
  <circle cx="645" cy="228" r="178" fill="url(#softBg)"/>

  
  <g fill="#C9BCF7">
